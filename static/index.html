<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Resume Analyzer & Job Matcher</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; color: #172033; background: #f4f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #172554; color: white; padding: 28px 20px; }
    header .wrap, main { max-width: 1100px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: clamp(23px, 4vw, 34px); }
    header p { margin: 0; color: #dbeafe; }
    main { padding: 24px 18px 50px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel, .result { background: white; border: 1px solid #e3e8f2; border-radius: 14px; padding: 20px; box-shadow: 0 5px 18px #1e293b0b; }
    label { display: block; font-weight: 700; margin-bottom: 9px; }
    textarea { width: 100%; min-height: 250px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 9px; padding: 12px; font: inherit; line-height: 1.5; }
    textarea:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
    button { background: #2563eb; color: white; border: 0; border-radius: 9px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
    .secondary { background: #e8eefc; color: #1e40af; }
    .muted { color: #64748b; font-size: 13px; }
    .error { color: #b91c1c; white-space: pre-wrap; }
    .score { font-size: 42px; font-weight: 800; color: #1d4ed8; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { background: #eff6ff; color: #1e40af; border-radius: 99px; padding: 6px 10px; font-size: 13px; }
    .columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .columns section { background: #f8fafc; border-radius: 10px; padding: 12px; min-width: 0; }
    h2 { font-size: 19px; margin: 0 0 15px; }
    h3 { font-size: 14px; margin: 0 0 10px; }
    .hidden { display: none; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
    @media (max-width: 760px) { .grid, .columns { grid-template-columns: 1fr; } textarea { min-height: 190px; } }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Smart Resume Analyzer & Job Matcher</h1>
    <p>Compare resume skills with job requirements and identify skill gaps.</p>
  </div>
</header>
<main>
  <div class="grid">
    <div class="panel">
      <label for="resume">Resume text</label>
      <textarea id="resume" placeholder="Paste your resume text here..."></textarea>
      <p class="muted">Paste text copied from your resume. PDF/DOCX parsing is not included yet.</p>
    </div>
    <div class="panel">
      <label for="job">Job description</label>
      <textarea id="job" placeholder="Paste the job description here..."></textarea>
      <p class="muted">Include the role responsibilities and required skills for a more useful comparison.</p>
    </div>
  </div>
  <div class="actions">
    <button id="matchButton" onclick="runMatch()">Analyze match</button>
    <button class="secondary" id="semanticButton" onclick="runSemanticMatch()">Semantic match (optional model)</button>
    <button class="secondary" onclick="loadSample()">Load sample</button>
    <button class="secondary" onclick="showHistory()">View history</button>
  </div>
  <p id="message" class="muted" role="status"></p>
  <div id="result" class="result hidden" aria-live="polite"></div>
  <div id="history" class="result hidden" style="margin-top:18px"></div>
</main>
<script>
const sampleResume = `Madhuri Katakam
Professional Summary
Electronics and Communication Engineering student with Python, SQL and machine learning experience.
Education
B.Tech Electronics and Communication Engineering
Skills
Python, SQL, Pandas, NumPy, Flask, SQLite, Git, Machine Learning, NLP
Projects
Retail Sales Analytics using Python, Pandas and SQL. Smart Resume Analyzer using NLP and Flask.`;

const sampleJob = `Data Analyst
Required skills: Python, SQL, Pandas, NumPy, Excel, Power BI, Statistics, Matplotlib.
Responsibilities: Analyze business data, prepare reports, create dashboards and communicate insights.`;

function loadSample() {
  document.getElementById("resume").value = sampleResume;
  document.getElementById("job").value = sampleJob;
  document.getElementById("message").textContent = "Sample data loaded. Click Analyze match.";
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[ch]);
}

function chips(items) {
  if (!items || !items.length) return '<span class="muted">None found</span>';
  return '<div class="chips">' + items.map(x => `<span class="chip">${escapeHtml(x)}</span>`).join("") + '</div>';
}

async function runMatch() {
  const resume_text = document.getElementById("resume").value.trim();
  const job_description = document.getElementById("job").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("matchButton");
  const resultBox = document.getElementById("result");
  document.getElementById("history").classList.add("hidden");

  if (!resume_text || !job_description) {
    message.textContent = "Please enter both resume text and job description.";
    message.className = "error";
    return;
  }

  button.disabled = true;
  message.textContent = "Analyzing...";
  message.className = "muted";
  try {
    const response = await fetch("/api/match", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resume_text, job_description })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Analysis failed.");

    const missing = data.missing_skills.map(x => `${x.skill} (${x.category})`);
    resultBox.innerHTML = `
      <h2>Analysis result</h2>
      <div class="score">${data.match_score}%</div>
      <p><strong>${escapeHtml(data.recommendation)}</strong></p>
      <p class="muted">Match ID: ${escapeHtml(data.match_id)} · ${escapeHtml(data.processed_at)}</p>
      <div class="columns">
        <section><h3>Matched skills (${data.matched_skills.length})</h3>${chips(data.matched_skills)}</section>
        <section><h3>Missing skills (${missing.length})</h3>${chips(missing)}</section>
        <section><h3>Additional resume skills (${data.extra_skills.length})</h3>${chips(data.extra_skills)}</section>
      </div>
      <div class="columns" style="margin-top:14px">
        <section><h3>Resume keywords (TF-IDF)</h3><pre>${escapeHtml(JSON.stringify(data.resume_keywords, null, 2))}</pre></section>
        <section><h3>Job keywords (TF-IDF)</h3><pre>${escapeHtml(JSON.stringify(data.job_keywords, null, 2))}</pre></section>
        <section><h3>Skill counts</h3><p>Resume: ${data.resume_skill_count}</p><p>Job description: ${data.job_skill_count}</p></section>
      </div>`;
    resultBox.classList.remove("hidden");
    message.textContent = "Analysis completed successfully.";
    message.className = "muted";
  } catch (error) {
    message.textContent = error.message;
    message.className = "error";
  } finally {
    button.disabled = false;
  }
}

async function runSemanticMatch() {
  const resume_text = document.getElementById("resume").value.trim();
  const job_description = document.getElementById("job").value.trim();
  const message = document.getElementById("message");
  const button = document.getElementById("semanticButton");
  const resultBox = document.getElementById("result");
  if (!resume_text || !job_description) {
    message.textContent = "Please enter both resume text and job description.";
    message.className = "error";
    return;
  }
  button.disabled = true;
  message.textContent = "Loading embedding model and comparing semantic similarity...";
  message.className = "muted";
  try {
    const response = await fetch("/api/match/semantic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resume_text, job_description })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Semantic analysis failed.");
    resultBox.innerHTML = `
      <h2>Semantic analysis</h2>
      <div class="score">${data.semantic_similarity}%</div>
      <p>Embedding cosine similarity using ${escapeHtml(data.semantic_model)}</p>
      <p><strong>Weighted recognized-skill match: ${data.match_score}%</strong></p>
      <div class="columns">
        <section><h3>Matched skills</h3>${chips(data.matched_skills)}</section>
        <section><h3>Missing skills</h3>${chips(data.missing_skills.map(x => x.skill))}</section>
        <section><h3>Learning recommendations</h3>${data.recommendations.map(x => `<p><strong>${escapeHtml(x.skill)}</strong> (${escapeHtml(x.priority)})<br>${escapeHtml(x.next_step)}</p>`).join("")}</section>
      </div>`;
    resultBox.classList.remove("hidden");
    message.textContent = "Semantic analysis completed.";
    message.className = "muted";
  } catch (error) {
    message.textContent = error.message;
    message.className = "error";
  } finally {
    button.disabled = false;
  }
}

async function showHistory() {
  const box = document.getElementById("history");
  const message = document.getElementById("message");
  try {
    const response = await fetch("/api/history");
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Could not load history.");
    box.innerHTML = `<h2>Recent analysis history</h2>` +
      (data.analyses.length ? data.analyses.map(item => `
        <p><strong>${item.match_score}%</strong> — ${escapeHtml(item.recommendation)}
        <span class="muted"> · ${escapeHtml(item.processed_at)}</span></p>
      `).join("") : '<p class="muted">No saved analyses yet.</p>');
    box.classList.remove("hidden");
    document.getElementById("result").classList.add("hidden");
  } catch (error) {
    message.textContent = error.message;
    message.className = "error";
  }
}
</script>
</body>
</html>
