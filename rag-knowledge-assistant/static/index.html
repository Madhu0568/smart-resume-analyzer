<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAG Knowledge Assistant</title>
<style>:root{font-family:Arial,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#172554;color:white;padding:28px max(20px,calc((100% - 900px)/2))}main{max-width:900px;margin:auto;padding:24px 20px}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-bottom:16px}button{border:0;border-radius:8px;padding:11px 16px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}input,textarea{font:inherit;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:10px 0}textarea{min-height:110px}.muted{color:#64748b;font-size:13px}.answer{white-space:pre-wrap;line-height:1.6}.source{background:#eff6ff;padding:10px;border-radius:8px;margin:8px 0}.error{color:#b91c1c}</style></head><body><header><h1>RAG Knowledge Assistant</h1><p>Upload documents and ask questions grounded in their content.</p></header><main>
<section class="panel"><h2>1. Add a document</h2><p class="muted">PDF, TXT or Markdown; maximum 15 MB.</p><input id="file" type="file" accept=".pdf,.txt,.md"><button onclick="uploadDocument()">Upload and index</button></section>
<section class="panel"><h2>2. Ask a question</h2><textarea id="question" placeholder="Ask about your uploaded documents..."></textarea><button onclick="askQuestion()">Ask assistant</button><p id="status" class="muted" role="status"></p></section>
<section class="panel" id="result" hidden><h2>Answer</h2><div id="answer" class="answer"></div><h3>Retrieved sources</h3><div id="sources"></div></section></main>
<script>
async function uploadDocument(){const f=document.getElementById('file').files[0],s=document.getElementById('status');if(!f){s.textContent='Choose a file first.';return;}const form=new FormData();form.append('file',f);s.textContent='Uploading and indexing...';try{const r=await fetch('/documents',{method:'POST',body:form}),d=await r.json();if(!r.ok)throw Error(d.detail||'Upload failed');s.textContent=`${d.message} ${d.source}: ${d.chunks_indexed} chunks indexed.`;}catch(e){s.textContent=e.message;s.className='error';}}
async function askQuestion(){const q=document.getElementById('question').value.trim(),s=document.getElementById('status');if(q.length<3){s.textContent='Enter a question with at least 3 characters.';return;}s.textContent='Retrieving context and generating answer...';try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Question failed');document.getElementById('answer').textContent=d.answer;document.getElementById('sources').innerHTML=d.sources.map(x=>`<div class="source">${escapeHtml(x.source)} — chunk ${x.chunk}</div>`).join('')||'No sources retrieved.';document.getElementById('result').hidden=false;s.textContent='Answer generated.';}catch(e){s.textContent=e.message;s.className='error';}}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
